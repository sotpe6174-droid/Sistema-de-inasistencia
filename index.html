      /* --- OPCIÓN 1: EXPORTAR A EXCEL (v1.2 AGRUPADO Y ORDENADO POR MAYOR FALTA) --- */
      function buildHistorialRows(ymFilter) {
        const filtered = appState.absences
          .filter(a => ymFilter === 'ALL' || a.date.startsWith(ymFilter))
          .slice()
          .sort((a, b) => a.date.localeCompare(b.date) || a.group.localeCompare(b.group) || a.student.localeCompare(b.student));

        if (filtered.length === 0) {
          return [{ Grupo: '', Alumno: '', Fecha: '', Dia_Semana: '' }];
        }

        return filtered.map(a => {
          const d = parseLocalDate(a.date);
          return {
            Grupo: a.group,
            Alumno: a.student,
            Fecha: a.date,
            Dia_Semana: d ? SPANISH_DAYS[d.getDay()] : ''
          };
        });
      }

      function buildListasRows() {
        const rows = [];
        GROUPS_CONFIG.forEach(cfg => {
          (appState.students[cfg.id] || []).forEach(st => {
            rows.push({ Grupo: cfg.id, Alumno: st });
          });
        });
        return rows.length > 0 ? rows : [{ Grupo: '', Alumno: '' }];
      }

      // Obtiene alumnos de un grupo ordenados de mayor a menor falta (y alfabéticamente)
      function getRankedGroupMatrix(groupId, ymFilter) {
        const stats = getGroupPeriodStats(groupId, ymFilter);
        const sessionDates = stats.distinctDates; // YYYY-MM-DD ordenados ascendentemente

        const absenceSetByStudent = new Map();
        stats.students.forEach(st => absenceSetByStudent.set(st, new Set()));
        stats.periodAbsences.forEach(a => {
          if (!absenceSetByStudent.has(a.student)) {
            absenceSetByStudent.set(a.student, new Set());
          }
          absenceSetByStudent.get(a.student).add(a.date);
        });

        const rankedStudents = Array.from(absenceSetByStudent.entries())
          .map(([student, dateSet]) => {
            const datesAsc = Array.from(dateSet).sort((a, b) => a.localeCompare(b));
            const count = datesAsc.length;
            const pctNum = stats.sessionsCount > 0 ? (count / stats.sessionsCount) * 100 : 0;
            const pctStr = `${pctNum.toFixed(1)}%`;
            const datesText = count > 0
              ? datesAsc.map(dt => formatShortDate(dt)).join(', ')
              : 'Sin faltas';

            return {
              student,
              count,
              pctNum,
              pctStr,
              datesAsc,
              datesText,
              dateSet
            };
          })
          .sort((a, b) => b.count - a.count || a.student.localeCompare(b.student))
          .map((item, idx) => ({ ...item, rank: idx + 1 }));

        const studentsWithAbsencesCount = rankedStudents.filter(s => s.count > 0).length;

        return {
          stats,
          sessionDates,
          rankedStudents,
          studentsWithAbsencesCount
        };
      }

      // Construye la hoja principal "Ranking_Por_Grupo" (Tabla resumen + 3 bloques agrupados y ordenados)
      function buildRankingPorGrupoSheet(ymFilter) {
        const periodLabel = formatMonthYearLabel(ymFilter);
        const aoa = [
          ['SISTEMA DE INASISTENCIAS — REPORTE AGRUPADO POR GRUPO Y RANKING DE FALTAS'],
          [`Período: ${periodLabel}`],
          [],
          ['RESUMEN GENERAL POR GRUPO'],
          ['Grupo', 'Día de Clase', 'Total Alumnos', 'Alumnos con Faltas', 'Sesiones Registradas', 'Total Faltas', '% Inasistencia']
        ];

        let grandStudents = 0;
        let grandWithAbs = 0;
        let grandSessions = 0;
        let grandAbsences = 0;
        let grandDenominator = 0;

        GROUPS_CONFIG.forEach(cfg => {
          const data = getRankedGroupMatrix(cfg.id, ymFilter);
          const pctStr = `${data.stats.pct.toFixed(1)}%`;
          aoa.push([
            cfg.id,
            cfg.dayNameCap,
            data.stats.studentsCount,
            data.studentsWithAbsencesCount,
            data.stats.sessionsCount,
            data.stats.totalAbsences,
            pctStr
          ]);
          grandStudents += data.stats.studentsCount;
          grandWithAbs += data.studentsWithAbsencesCount;
          grandSessions += data.stats.sessionsCount;
          grandAbsences += data.stats.totalAbsences;
          grandDenominator += data.stats.studentsCount * data.stats.sessionsCount;
        });

        const grandPct = grandDenominator > 0 ? `${((grandAbsences / grandDenominator) * 100).toFixed(1)}%` : '0.0%';
        aoa.push(['TOTAL GENERAL', '-', grandStudents, grandWithAbs, grandSessions, grandAbsences, grandPct]);
        aoa.push([]);

        let maxCols = 7;

        // Bloques individuales: MIEMBROS 1, MIEMBROS 2, MIEMBROS 3
        GROUPS_CONFIG.forEach(cfg => {
          const data = getRankedGroupMatrix(cfg.id, ymFilter);
          const dateHeaders = data.sessionDates.map(dt => formatShortDate(dt));
          const headerRow = ['Puesto', 'Alumno', 'Cantidad Faltas', '% Inasistencia', 'Fechas de Inasistencia', ...dateHeaders];
          if (headerRow.length > maxCols) maxCols = headerRow.length;

          aoa.push([`${cfg.id.toUpperCase()} (${cfg.dayNameCap.toUpperCase()}) — ORDENADO DE MAYOR A MENOR FALTA`]);
          aoa.push(headerRow);

          if (data.rankedStudents.length === 0) {
            aoa.push(['-', 'Sin alumnos inscritos en este grupo', 0, '0.0%', 'Sin faltas']);
          } else {
            data.rankedStudents.forEach(st => {
              const marks = data.sessionDates.map(dt => (st.dateSet.has(dt) ? 'X' : ''));
              aoa.push([
                st.rank,
                st.student,
                st.count,
                st.pctStr,
                st.datesText,
                ...marks
              ]);
            });
          }

          // Fila de totales del grupo y por cada fecha de sesión
          const perDateTotals = data.sessionDates.map(dt =>
            data.rankedStudents.reduce((acc, st) => acc + (st.dateSet.has(dt) ? 1 : 0), 0)
          );
          aoa.push([
            '',
            `TOTAL ${cfg.id.toUpperCase()}`,
            data.stats.totalAbsences,
            `${data.stats.pct.toFixed(1)}%`,
            `${data.stats.sessionsCount} sesiones registradas`,
            ...perDateTotals
          ]);
          aoa.push([]);
        });

        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const colWidths = [
          { wch: 10 }, // Puesto
          { wch: 28 }, // Alumno
          { wch: 16 }, // Cantidad Faltas
          { wch: 15 }, // % Inasistencia
          { wch: 38 }  // Fechas de Inasistencia
        ];
        for (let i = 5; i < maxCols; i++) {
          colWidths.push({ wch: 13 });
        }
        ws['!cols'] = colWidths;
        return ws;
      }

      // Construye la hoja individual para "Miembros 1", "Miembros 2" o "Miembros 3"
      function buildIndividualGroupSheet(groupId, ymFilter) {
        const cfg = getGroupConfig(groupId);
        const data = getRankedGroupMatrix(groupId, ymFilter);
        const periodLabel = formatMonthYearLabel(ymFilter);
        const dateHeaders = data.sessionDates.map(dt => formatShortDate(dt));

        const aoa = [
          [`${groupId.toUpperCase()} — DÍA DE CLASE: ${cfg.dayNameCap.toUpperCase()}`],
          [`Período: ${periodLabel} | Sesiones: ${data.stats.sessionsCount} | Total Faltas: ${data.stats.totalAbsences} (${data.stats.pct.toFixed(1)}%)`],
          [],
          ['Puesto', 'Alumno', 'Cantidad Faltas', '% Inasistencia', 'Fechas de Inasistencia', ...dateHeaders]
        ];

        if (data.rankedStudents.length === 0) {
          aoa.push(['-', 'Sin alumnos inscritos en este grupo', 0, '0.0%', 'Sin faltas']);
        } else {
          data.rankedStudents.forEach(st => {
            const marks = data.sessionDates.map(dt => (st.dateSet.has(dt) ? 'X' : ''));
            aoa.push([
              st.rank,
              st.student,
              st.count,
              st.pctStr,
              st.datesText,
              ...marks
            ]);
          });
        }

        const perDateTotals = data.sessionDates.map(dt =>
          data.rankedStudents.reduce((acc, st) => acc + (st.dateSet.has(dt) ? 1 : 0), 0)
        );
        aoa.push([
          '',
          `TOTAL ${groupId.toUpperCase()}`,
          data.stats.totalAbsences,
          `${data.stats.pct.toFixed(1)}%`,
          `${data.stats.sessionsCount} sesiones`,
          ...perDateTotals
        ]);

        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const colWidths = [
          { wch: 10 },
          { wch: 28 },
          { wch: 16 },
          { wch: 15 },
          { wch: 38 }
        ];
        data.sessionDates.forEach(() => colWidths.push({ wch: 13 }));
        ws['!cols'] = colWidths;
        return ws;
      }

      // Construye la hoja "Ranking_General" para la exportación separada por meses
      function buildRankingGeneralMonthlySheet(monthsAsc) {
        const aoa = [
          ['SISTEMA DE INASISTENCIAS — RESUMEN GENERAL POR MES Y GRUPO'],
          [],
          ['Mes / Período', 'Grupo', 'Día de Clase', 'Total Alumnos', 'Alumnos con Faltas', 'Sesiones', 'Total Faltas', '% Inasistencia']
        ];

        monthsAsc.forEach(ym => {
          const mLabel = formatMonthYearLabel(ym);
          GROUPS_CONFIG.forEach(cfg => {
            const data = getRankedGroupMatrix(cfg.id, ym);
            aoa.push([
              mLabel,
              cfg.id,
              cfg.dayNameCap,
              data.stats.studentsCount,
              data.studentsWithAbsencesCount,
              data.stats.sessionsCount,
              data.stats.totalAbsences,
              `${data.stats.pct.toFixed(1)}%`
            ]);
          });
        });

        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = [
          { wch: 20 },
          { wch: 15 },
          { wch: 14 },
          { wch: 15 },
          { wch: 18 },
          { wch: 12 },
          { wch: 14 },
          { wch: 15 }
        ];
        return ws;
      }

      function appendCompleteRankedWorkbookSheets(wb, ymFilter) {
        // Hoja 1: Ranking_Por_Grupo
        XLSX.utils.book_append_sheet(wb, buildRankingPorGrupoSheet(ymFilter), 'Ranking_Por_Grupo');
        // Hojas 2, 3 y 4: Miembros 1, Miembros 2 y Miembros 3
        GROUPS_CONFIG.forEach(cfg => {
          XLSX.utils.book_append_sheet(wb, buildIndividualGroupSheet(cfg.id, ymFilter), cfg.id);
        });
        // Hoja 5: Historial_Inasistencias
        const wsHist = XLSX.utils.json_to_sheet(buildHistorialRows(ymFilter));
        wsHist['!cols'] = [{ wch: 15 }, { wch: 28 }, { wch: 14 }, { wch: 15 }];
        XLSX.utils.book_append_sheet(wb, wsHist, 'Historial_Inasistencias');
        // Hoja 6: Listas_Alumnos
        const wsList = XLSX.utils.json_to_sheet(buildListasRows());
        wsList['!cols'] = [{ wch: 15 }, { wch: 28 }];
        XLSX.utils.book_append_sheet(wb, wsList, 'Listas_Alumnos');
      }
